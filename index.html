<!DOCTYPE html>
<html lang="en">
<head><style>
        /* General styling for padding and rounded corners on all sections */
        header, section {
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        header {
            background-color: #2c3e50;
            color: #d74848;
        }
        header a {
            color: #47bfdd;
            margin-right: 15px;
            text-decoration: none;
        }
        #home {
            background-color: #5372c0;
        }
        #about {
            background-color: #5372c0;
        } 
        #skills {
            background-color: #5372c0;
        }

        #projects {
            background-color: #5372c0;
        }
        #contact {
            background-color: #5372c0;
        }
        #textarea {
            background-color: #5372c0;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragul - Portfolio</title>
    <body style="background-color: #020b14;">
</head>
<body>
    <header>
        <h1>MY PORTFOLIO</h1>
        <nav><
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h3>Hello, I'm Ragul</h3>
            <p>I'm a frontend developer learning to build websites.</p>
        </section>
        <section id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>python</li>
                <li>c</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>
        <section id="projects">
            <h2>My Projects</h2>
            <article>
                <h4>Project x</h4>
                <p>project 1</p>
            </article>
            <article>
                <h4>Project a-z</h4>
                <p>About project 2</p>
            </article>
            <article>
                <h4>Project y</h4>
                <p>About project 3</p>
            </article>
        </section>
        <section id="contact">
            <h2>Contact Me</h2>
            <form>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" cols="30" required></textarea>
                </div>
                <br>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
</body>
</html>
